apiVersion: v1
kind: Namespace
metadata:
  name: rr06
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: rr06
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rr06-ca
  namespace: rr06
spec:
  isCA: true
  commonName: rr06-ca
  secretName: rr06-ca-tls
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Never
  issuerRef:
    name: selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: rr06-ca-issuer
  namespace: rr06
spec:
  ca:
    secretName: rr06-ca-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: leaf1
  namespace: rr06
spec:
  commonName: leaf1.rr06.example.test
  dnsNames:
    - leaf1.rr06.example.test
  secretName: leaf1-tls
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: rr06-ca-issuer
    kind: Issuer
